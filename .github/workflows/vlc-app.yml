name: vlc-app

# Builds VLC for iOS (github.com/videolan/vlc-ios, GPLv2) unsigned for arm64, strips extensions, ad-hoc signs it and
# publishes VLC.app.zip (about 40 MB) to the branch builds-vlc.
on:
  push:
    branches: [spes]
    paths:
      - ".github/workflows/vlc-app.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "vlc-ios commit or tag"
        default: "955281478edb7bc37d75c990627cc833f423ecac"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Clone vlc-ios
        run: |
          git clone https://github.com/videolan/vlc-ios vlc-ios
          cd vlc-ios && git checkout "${{ github.event.inputs.ref || '955281478edb7bc37d75c990627cc833f423ecac' }}" && git log -1 --format='%H %s'
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app; xcodebuild -version
          NEW=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEW" ]; then sudo xcode-select -s "$NEW"; fi
          xcodebuild -version
      - name: Pods
        working-directory: vlc-ios
        run: |
          pod install 2>&1 | tail -30
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: vlc-ios/build
          key: vlc-build-${{ github.event.inputs.ref || 'default' }}-${{ github.run_id }}
          restore-keys: |
            vlc-build-
      - name: Build
        working-directory: vlc-ios
        run: |
          set -o pipefail
          xcodebuild -workspace VLC.xcworkspace -scheme VLC-iOS-no-watch -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > ../xcodebuild.log 2>&1 || { grep -a -v "Disabling previews" ../xcodebuild.log | tail -80 | cut -c1-600; echo "-----actool"; grep -a -i -B3 -A10 "actool\|CompileAssetCatalog" ../xcodebuild.log | grep -a -v "Disabling previews" | tail -60 | cut -c1-600; exit 65; }
      - name: Package
        run: |
          APP=$(find vlc-ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          [ -d "$APP" ] || { echo "no .app produced"; tail -150 xcodebuild.log; exit 1; }
          rm -rf "$APP/PlugIns" "$APP/Watch"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleExecutable|MinimumOSVersion|CFBundleShortVersionString"
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do [ -e "$f" ] && codesign --force -s - "$f"; done
          codesign --force -s - "$APP"
          file "$APP/$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          mkdir -p out && rm -rf out/VLC.app && cp -R "$APP" out/VLC.app
          cd out && zip -qr VLC.app.zip VLC.app && ls -l VLC.app.zip
      - name: Publish to the builds-vlc branch
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp out/VLC.app.zip xcodebuild.log /tmp/pub/
          cd /tmp/pub && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "VLC for iOS"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/builds-vlc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
