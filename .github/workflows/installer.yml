name: installer

on:
  push:
    branches: [spes]
    paths:
      - "userland/installer/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Build
        run: |
          set -o pipefail
          mkdir -p userland/installer/out
          (
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos -f clang)
          "$CC" -target arm64-apple-ios16.0 -isysroot "$SDK" -O2 -framework CoreFoundation -lz \
            -o userland/installer/out/topaz-install userland/installer/topaz-install.c
          codesign --force -s - userland/installer/out/topaz-install
          file userland/installer/out/topaz-install
          ) 2>&1 | tee userland/installer/out/build.log
      - name: Publish to the builds-installer branch
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp userland/installer/out/topaz-install userland/installer/out/build.log /tmp/pub/ || true
          cd /tmp/pub && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "topaz-install"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/builds-installer
